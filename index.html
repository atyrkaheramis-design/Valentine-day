<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Be My Valentine? 💗</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: #000;

            font-family: Arial, sans-serif;
        }


        /* =========================
           PHONE SCREEN
        ========================= */

        .container {

            width: 100%;

            max-width: 500px;

            min-height: 100vh;

            margin: auto;

            background: #f6a9c1;

            position: relative;

            overflow: hidden;
        }


        /* =========================
           BLACK HEADER
        ========================= */

        .header {

            height: 65px;

            background: #000;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 13px;

            letter-spacing: .3px;
        }


        /* =========================
           MAIN PAGE
        ========================= */

        .page {

            min-height: calc(100vh - 65px);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 25px;

            position: relative;
        }


        /* =========================
           DECORATIVE HEARTS
        ========================= */

        .page::before {

            content: "♡";

            position: absolute;

            top: 15%;

            left: 12%;

            color: #e47d9b;

            font-size: 32px;

            transform: rotate(-15deg);
        }


        .page::after {

            content: "♡";

            position: absolute;

            top: 25%;

            right: 12%;

            color: #e47d9b;

            font-size: 25px;

            transform: rotate(15deg);
        }


        /* =========================
           YOUR PICTURE
        ========================= */

        .picture {

            width: 125px;

            height: 125px;

            object-fit: cover;

            background: white;

            padding: 6px;

            border-radius: 5px;

            margin-bottom: 20px;

            box-shadow:
                0 5px 15px rgba(0,0,0,.15);

            animation: pictureAppear 1s ease;
        }


        /* =========================
           QUESTION
        ========================= */

        .question {

            color: #222;

            font-family: Georgia, serif;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 20px;

            animation: textAppear 1s ease;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            position: relative;
        }


        button {

            border: none;

            color: white;

            font-size: 13px;

            font-weight: bold;

            padding: 9px 25px;

            border-radius: 5px;

            cursor: pointer;

            transition: transform .2s ease;
        }


        /* YES BUTTON */

        .yes {

            background: #149447;
        }


        .yes:hover {

            transform: scale(1.08);
        }


        /* NO BUTTON */

        .no {

            background: #e51d2a;

            z-index: 100;

            transition:
                left .15s ease,
                top .15s ease;
        }


        /* =========================
           LOVE SCREEN
        ========================= */

        .love-screen {

            display: none;

            position: absolute;

            inset: 65px 0 0 0;

            background: #f6a9c1;

            justify-content: center;

            align-items: center;

            flex-direction: column;

            text-align: center;

            padding: 25px;

            z-index: 50;

            animation: loveAppear .7s ease;
        }


        /* FINAL PICTURE */

        .love-picture {

            width: 140px;

            height: 140px;

            object-fit: cover;

            background: white;

            padding: 6px;

            border-radius: 6px;

            margin-bottom: 20px;

            box-shadow:
                0 5px 15px rgba(0,0,0,.15);
        }


        /* FINAL MESSAGE */

        .love-text {

            color: #222;

            font-family: Georgia, serif;

            font-size: 19px;

            font-weight: bold;

            line-height: 1.7;
        }


        /* =========================
           FLOATING HEARTS
        ========================= */

        .love-heart {

            position: absolute;

            bottom: -40px;

            color: #df4b79;

            font-size: 25px;

            pointer-events: none;

            animation:
                floatHeart 4s linear forwards;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes pictureAppear {

            from {

                opacity: 0;

                transform:
                    scale(.7)
                    rotate(-5deg);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0);
            }
        }


        @keyframes textAppear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes loveAppear {

            from {

                opacity: 0;

                transform:
                    scale(.8);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            20% {

                opacity: 1;
            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =========================
           PHONE RESPONSIVE
        ========================= */

        @media (max-width: 400px) {

            .header {

                height: 60px;

                font-size: 11px;
            }

            .picture {

                width: 110px;

                height: 110px;
            }

            .question {

                font-size: 16px;
            }

            button {

                padding:
                    8px 20px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        Send this to someone special 💗

    </div>



    <!-- =========================
         FIRST SCREEN
    ========================= -->

    <div class="page"
         id="firstPage">


        <!--
            CHANGE THIS IMAGE NAME
            TO YOUR OWN PHOTO
        -->

        <img
            src="my-picture.jpg"
            class="picture"
            alt="My picture"
        >


        <div class="question">

            Will you be my Valentine? 💗

        </div>


        <div class="buttons">


            <!-- YES -->

            <button
                class="yes"
                onclick="yesClicked()">

                YES 💗

            </button>


            <!-- NO -->

            <button
                class="no"
                id="noButton">

                NO 😭

            </button>


        </div>

    </div>



    <!-- =========================
         SUCCESS SCREEN
    ========================= -->

    <div
        class="love-screen"
        id="loveScreen">


        <img
            src="my-picture.jpg"
            class="love-picture"
            alt="Our picture"
        >


        <div class="love-text">

            YAYYYYY! 💗🥰

            <br><br>

            You said YES! 💕

            <br>

            Happy Valentine's Day! 🌷

            <br><br>

            Pano ba yan shyne sakin kana dapat kiligin HAHAHA! 💖

        </div>

    </div>


</div>



<script>


/* =========================
   YES BUTTON
========================= */

function yesClicked() {

    document.getElementById("loveScreen")
        .style.display = "flex";


    createHearts();

}



/* =========================
   RUNAWAY NO BUTTON
========================= */

const noButton =
    document.getElementById("noButton");


/*
   Desktop:
   The button runs away
   when the mouse gets near it.
*/

noButton.addEventListener(
    "mouseover",
    moveNoButton
);


/*
   Phone:
   The button moves when
   they try to touch it.
*/

noButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveNoButton();

    }
);



/* =========================
   MOVE NO BUTTON
========================= */

function moveNoButton() {


    const container =
        document.querySelector(".container");


    /*
       Make sure the button
       stays inside the screen.
    */

    const maxX =
        container.clientWidth
        - noButton.offsetWidth
        - 10;


    const maxY =
        container.clientHeight
        - noButton.offsetHeight
        - 10;


    const randomX =
        Math.random() * maxX;


    const randomY =
        Math.random() * maxY;


    /*
       Move the button
       to a random position.
    */

    noButton.style.position = "fixed";


    noButton.style.left =
        randomX + "px";


    noButton.style.top =
        randomY + "px";

}



/* =========================
   FLOATING HEARTS
========================= */

function createHearts() {


    const screen =
        document.getElementById("loveScreen");


    for (
        let i = 0;
        i < 30;
        i++
    ) {


        const heart =
            document.createElement("div");


        heart.className =
            "love-heart";


        heart.innerHTML =
            [
                "♡",
                "♥",
                "💕",
                "💗",
                "💖"
            ]
            [
                Math.floor(
                    Math.random() * 5
                )
            ];


        heart.style.left =
            Math.random() * 100 + "%";


        heart.style.animationDelay =
            Math.random() * 3 + "s";


        heart.style.fontSize =
            (15 + Math.random() * 20) + "px";


        screen.appendChild(heart);

    }

}

</script>


</body>

</html>
